[package]
name = "rasq_wasm_runtime_core"
version = "0.1.0"
edition = "2021"
# crates.io には出さない (cargo-deny の licenses は private を見ない)。
publish = false

[lib]
name = "rasq_wasm_runtime_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
wasmi = "1"
serde_json = "1"
# Native `net.fetch` backend (PROTOCOL §4 / D-023): blocking HTTP inside the
# runtime so mobile hosts don't need a synchronous Dart HTTP bridge. Pure
# Rust TLS (rustls) so it cross-compiles to iOS/Android untouched.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# gpu.compute (D-081): WGSL compute 専用の狭い GPU 口。ネイティブは wgpu
# (macOS/iOS = Metal, Android = Vulkan)、Web ビルドでは WebGPU にそのまま
# 写る想定。フル WebGPU(レンダーパイプライン)は出さない — 重い/非対応の
# ときはエラーで返し、プラグインはクラウドカルクレーター(ml.infer)へ
# フォールバックする。
wgpu = "22"
pollster = "0.3"
base64 = "0.22"
# .rasqpkg(D-034: zstd 圧縮 tar)の展開。純 Rust の復号器なので C ツールチェーン無しで iOS / Android にもそのまま
# クロスコンパイルできる(圧縮は要らない: 作るのは rasq CLI 側)。
ruzstd = "0.8"

[dev-dependencies]
# テストで圧縮側を作るためだけ(C の zstd)。ランタイム本体には入らない。
zstd = "0.13"
