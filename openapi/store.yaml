# RASQ プラグインストア契約 v0 (D-033) — クライアント側から先に定義する正本。
# ORGATE-server はこの契約を実装する。REST/JSON。将来 WebTransport 化しても
# ペイロード(components.schemas)はそのまま流用する。
# ストアは審査済みプラグインのみ掲載(D-004 ②)。サイドロードはアプリ側の
# 「プラグインのインポート」導線のみで、この API を通らない。
openapi: 3.1.0
info:
  title: RASQ Plugin Store API
  version: 0.1.0
  description: >-
    プラグインストア(M4)のページ関数/構成取得関数/インストール関数/レビュー関数。
    認証は RASQ アカウントの Bearer(閲覧は匿名可、レビュー投稿・ブックマークは要認証)。
    サーバーは 2 台に分かれている(rasq-central ARCHITECTURE_SPLIT)。掲載・構成・配布物・レビュー・ブックマーク・カスタムセッションは
    RASQ Central、**お金(ポイントの残高・購入・支払いの設定)は ORGATE-Server**(第 4 段階、rasq-client D-401 / ORGATE O-004 /
    Central S-065)。ORGATE の口の操作には `servers` を個別に付けた。トークンはどちらも ORGATE が出すアクセストークン。
    **公開テストでは有料の機能が止まっている**(ORGATE `ORGATE_PAID_FEATURES=off` が既定): ポイント・購入・有料プラグインの
    構成 / 配布物は `403 paid_features_disabled`。アプリは `GET /payments/config` の `paidFeatures` で UI を出し分ける。
servers:
  - url: https://central.rasq.example/api/v1
    description: RASQ Central(ストアの掲載・配布)
paths:
  /home:
    get:
      operationId: storeHome
      summary: ストアホーム(今週のトレンド/ブックマーク/おすすめ)
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  trending: { type: array, items: { $ref: "#/components/schemas/PluginCard" } }
                  bookmarks: { type: array, items: { $ref: "#/components/schemas/PluginCard" } }
                  recent: { type: array, items: { $ref: "#/components/schemas/PluginCard" } }
  /plugins:
    get:
      operationId: searchPlugins
      summary: 検索 + 探索導線(カテゴリ/SNS別/用途別/無料・広告/公式・検証済み/最近更新/軽量/オフライン)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sns, in: query, schema: { type: string }, description: 対象 SNS (misskey / bluesky / …) }
        - { name: filter, in: query, schema: { type: array, items: { type: string, enum: [free, no_ads, official, verified, recent, lightweight, offline] } }, style: form, explode: false }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, downloads, rating, updated] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PluginCard" } }
                  nextCursor: { type: [string, "null"] }
  /plugins/{pluginId}:
    get:
      operationId: pluginPage
      summary: プラグインページ(プレビュー/DL数/評価/バージョン/権限/常設安全性ブロック)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PluginDetail" } } } }
  /plugins/{pluginId}/purchase:
    servers: [{ url: https://orgate.rasq.example/api/v1, description: ORGATE-Server }]
    post:
      operationId: purchasePlugin
      summary: 有料プラグインをポイントで購入(rasq-client D-355。**ORGATE-Server**、D-401)
      description: >-
        **ORGATE-Server の口**(第 4 段階、D-401 / O-004。Central の同じ経路は 404 になった)。購入の記録は ORGATE が持ち、
        Central の `GET /plugins/{id}` の `purchased` は Central が ORGATE に聞いて付ける。
        ポイント = Web コンソールで Stripe から買う(付与から 1 か月で失効)。**有効期限の近い付与から**減らす。
        1 ポイント = 1 円(`price` を切り上げた数)。すでに持っていれば減らさずに 200(`pointsSpent: 0`)。無料なら 400。
        購入は RASQ アカウントに付く(同じアカウントならどの端末でも入れられる)。
      security: [{ bearer: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [purchased, pointsSpent, balance]
                properties:
                  purchased: { type: boolean }
                  pointsSpent: { type: integer }
                  balance: { type: integer, description: 購入後の残り(失効していない付与の合計) }
        "400": { description: 無料のプラグイン }
        "403": { description: "公開テストで有料の機能が止まっている(error.code = paid_features_disabled)/ 利用規約の承諾がまだ(error.code = terms_required)" }
        "404": { description: 掲載されていない }
        "409": { description: "ポイントが足りない(error.code = insufficient_points、残りは error.message)" }
  /plugins/{pluginId}/manifest:
    get:
      operationId: pluginManifest
      summary: 構成取得(インストール前のマニフェスト+アーティファクト一覧。確認シートの根拠)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string }, description: 省略時は stable 最新 }
        - { name: session, in: query, schema: { type: string }, description: "カスタムセッションの id(ページ型の一時利用、rasq-central S-048)。そのセッションが有効で、このプラグインのもので、呼んだ人が WS に入れる人なら、購入していなくても通す" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/InstallManifest" } } } }
        "403": { description: "有料で、このアカウントが買っていない(error.code = purchase_required。配布物も同じ)。session 付きでも入れない人なら同じ。公開テストで有料の機能が止まっている(ORGATE の paidFeatures = false)ときの有料プラグインは error.code = paid_features_disabled" }
  /plugins/{pluginId}/artifacts/{artifactId}:
    get:
      operationId: downloadArtifact
      summary: インストール関数のダウンロード実体(.rasqpkg = Zstd tar。SHA-512 + ed25519 署名は InstallManifest 側)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: artifactId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string }, description: 省略時は現在版(manifest と同じ版を指定する) }
        - { name: session, in: query, schema: { type: string }, description: "カスタムセッションの id(manifest の session と同じ規則で、未購入でも通す。S-048)" }
      responses:
        "200": { content: { application/zstd: { schema: { type: string, format: binary } } } }
        "403": { description: "有料で未購入(error.code = purchase_required)/ 公開テストで有料の機能が止まっている(error.code = paid_features_disabled)" }
  /plugins/{pluginId}/reviews:
    get:
      operationId: reviews
      summary: レビュー一覧(実利用済み/利用バージョン/開発者返信/参考になった/通報/並び替え)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [helpful, recent, rating_high, rating_low] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Review" } }
                  nextCursor: { type: [string, "null"] }
    post:
      operationId: createReview
      summary: レビュー作成(要認証。実利用済みフラグはサーバーがインストール履歴から付ける)
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, description: 見出し(任意、80 文字まで) }
                body: { type: string }
                usedVersion: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
  /plugins/{pluginId}/reviews/{reviewId}/vote:
    put:
      operationId: voteReview
      summary: レビューへの「参考になった / ならなかった」投票(要認証。1 アカウント 1 票、none で取り消し)
      security: [{ bearer: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties:
                vote: { type: string, enum: [up, down, none] }
      responses:
        "204": { description: ok }
  /plugins/{pluginId}/releases:
    get:
      operationId: releaseNotes
      summary: リリースノート(アップデート差分。権限増加は permissionsAdded で明示 → 自動更新を止める判断材料)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReleaseNote" } }
                  nextCursor: { type: [string, "null"] }
  /me/bookmarks:
    get:
      operationId: myBookmarks
      summary: ストアのブックマーク一覧(要認証)
      security: [{ bearer: [] }]
      responses:
        "200": { content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PluginCard" } } } } }
    put:
      operationId: setBookmark
      summary: ブックマーク追加/削除
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, bookmarked]
              properties:
                pluginId: { type: string }
                bookmarked: { type: boolean }
      responses:
        "204": { description: ok }
  /me/points:
    servers: [{ url: https://orgate.rasq.example/api/v1, description: ORGATE-Server }]
    get:
      operationId: myPoints
      summary: ポイントの残高・付与・購入の履歴(要認証。**ORGATE-Server**、rasq-client D-355 → D-401)
      description: >-
        ORGATE-Server の口(第 4 段階。Central の同じ経路は 404 になった)。残高 = 失効していない付与の残りの合計。
      security: [{ bearer: [] }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Points" } } } }
        "403": { description: "公開テストで有料の機能が止まっている(error.code = paid_features_disabled)" }
  /payments/config:
    servers: [{ url: https://orgate.rasq.example/api/v1, description: ORGATE-Server }]
    get:
      operationId: paymentsConfig
      summary: 支払いの設定(認証なし。**ORGATE-Server**、rasq-client D-401 / ORGATE O-004)
      description: >-
        有料の機能が使えるか(`paidFeatures`、ORGATE `ORGATE_PAID_FEATURES`。公開テストは false が既定)、Stripe の構成、
        ポイントのパック、開発者の審査料。アプリは読めない(ORGATE につながない / 落ちている)ときも有料の機能は止まっている扱いにする。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PaymentsConfig" } } } }
  /custom/sessions:
    post:
      operationId: createCustomSession
      summary: ページ型プラグイン(shared)のセッションを作る(rasq-client D-357 / rasq-central S-048、契約 v0.18 docs/slots.md §2.13)
      description: >-
        プラグインが掲載されていて、その版のマニフェストが slots に page、page.mode = shared、scope に合う surfaces
        (room: → astell、profile → profile、link → page)を持つこと(違えば 400 not_shared_page)。有料なら作る人が購入済み
        (403 purchase_required)。
        room:<roomId> = ルームのオーナーかモデレーター(= ホストの承認)で、ルームが開いていること。同じルーム × プラグインで
        有効なものがあればそれを返す(200)。作ったらルームの WS に {"type":"custom","action":"deployed","session":CustomSession} を配る。
        profile = profile:<自分>。同じプラグインで有効なものがあればそれを返す。
        link = 新しいセッション + inviteCode(招待)。
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, scope]
              properties:
                pluginId: { type: string }
                version: { type: string, description: 省略時は現在版 }
                scope: { type: string, pattern: "^(room:.+|profile|link)$", description: "room:<roomId> / profile / link" }
      responses:
        "200": { description: "既にある有効なセッション, content: { application/json: { schema: { $ref: \"#/components/schemas/CustomSession\" } } }" }
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/CustomSession" } } } }
        "400": { description: "error.code = not_shared_page(page / shared / surfaces が合わない)か bad_scope" }
        "403": { description: "error.code = purchase_required / not_room_host(room: でオーナー・モデレーターでない)" }
        "404": { description: プラグインかルームが無い(ルームが閉じている) }
    get:
      operationId: listCustomSessions
      summary: scope の有効なセッション(新しい順)
      security: [{ bearer: [] }]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, pattern: "^(room|profile):.+$" }, description: "room:<roomId> か profile:<accountId>" }
      responses:
        "200": { content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CustomSession" } } } } }
  /custom/sessions/{sessionId}:
    get:
      operationId: customSession
      summary: セッションの中身(変数と今の参加者)
      security: [{ bearer: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [session, vars, participants]
                properties:
                  session: { $ref: "#/components/schemas/CustomSession" }
                  vars: { $ref: "#/components/schemas/CustomVars" }
                  participants: { type: array, items: { $ref: "#/components/schemas/CustomParticipant" } }
        "404": { description: 無いか閉じている }
    delete:
      operationId: closeCustomSession
      summary: セッションを閉じる
      description: >-
        閉じられるのは作った人、room: ならルームのオーナー / モデレーター、profile: なら持ち主。セッションの WS に closed、
        room: ならルームの WS に {"type":"custom","action":"closed","sessionId"} を配る。
      security: [{ bearer: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: ok }
        "403": { description: 閉じる権利が無い }
        "404": { description: 無いか既に閉じている }
  /custom/sessions/{sessionId}/ws:
    get:
      operationId: customSessionWs
      summary: セッションの WebSocket(変数の同期とサーバー関数の中継)
      description: >-
        AsTell の WS と同じ認証(?token=…)。入れる人: room: = そのルームに今つながっているピア、またはオーナー / モデレーター。
        profile: / link: = ログイン済みなら誰でも(持ち主にブロックされていたら 403)。page.maxParticipants を超えたら 409。
        受信(クライアント → サーバー)は CustomWsClientMessage、送信は CustomWsServerMessage(JSON テキストフレーム)。
        キーは ^[A-Za-z0-9_.:@-]{1,64}$、me. で始まるキーは @<accountId>. に書き換え、@<accountId>. のキーは本人だけが書ける。
        値は JSON 16 KiB まで、1 セッション 256 キー・合計 1 MiB まで、call の args は 16 KiB まで、1 接続 20 通/秒まで(超えたら error)。
        op の append は 500 要素まで(超えたら先頭から捨てる)。ホストはこれを page.event(docs/slots.md §2.13)に写す。
      security: []
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string }, description: RASQ のアクセストークン }
      responses:
        "101": { description: "Switching Protocols。最初に welcome が来る" }
        "403": { description: 入れない(ブロック / ルームにいない) }
        "404": { description: 無いか閉じている }
        "409": { description: maxParticipants を超えた }
  /custom/invites/{code}:
    get:
      operationId: customInvite
      summary: "招待コード(link: のセッション)からセッションを引く"
      security: [{ bearer: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CustomSession" } } } }
        "404": { description: 無いか閉じている }
  /accounts/{handle}/pages:
    get:
      operationId: profilePages
      summary: RASQ アカウントのプロフィールに置かれたページ型プラグイン(タイル、S-048)
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProfilePage" } } } } }
        "404": { description: アカウントが無い }
  /me/pages:
    put:
      operationId: setProfilePages
      summary: 自分のプロフィールに置くページ型プラグイン(並び順どおり、8 個まで。インストールの確認はクライアント側)
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [pluginId]
                    properties:
                      pluginId: { type: string }
                      version: { type: string, description: 省略 = 現在版 }
      responses:
        "200": { content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProfilePage" } } } } }
        "400": { description: "9 個以上、掲載されていない、slots に page が無い、surfaces に profile が無い(error.code = not_profile_page)" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    PluginStatus:
      type: string
      description: 状態表記の統一(rasq_design のステータストークンと 1:1)
      enum: [in_review, published, update_available, warning, suspended, withdrawn, unlisted, beta, revoked]
    PluginCard:
      type: object
      required: [id, name, version, status]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string }
        iconUrl: { type: string, format: uri }
        version: { type: string }
        status: { $ref: "#/components/schemas/PluginStatus" }
        origin: { type: string, enum: [official, verified, community] }
        rating: { type: number }
        downloads: { type: integer }
        sizeMb: { type: number }
        hasAds: { type: boolean }
        price: { type: number, description: 0 = 無料 }
        developerName: { type: string, description: 開発者の表示名(ストアホームのタイル。rasq-client D-353) }
        previews:
          type: array
          maxItems: 4
          items: { type: string, format: uri }
          description: タイルの自動スライドに出すプレビュー画像(詳細の screenshots の先頭 4 枚。無ければ空 / 省略)
        pluginType:
          type: string
          enum: [sns, composer, post, viewer, timeline, astell, trend, theme, assets, custom, other]
          description: >-
            プラグインの種別(ストアのタイルの色と見出し、rasq-client D-354)。現在版のマニフェストから導く:
            slots に page があれば custom(ページ型 = カスタムプラグイン、D-357 / S-048。ほかより優先)。
            kind = sns / theme / assets はそのまま、それ以外は最初の slot の頭(composer.* → composer、post.* → post、
            viewer.* → viewer、tl* → timeline、astell.* → astell、trend.* → trend)。kind = view / mediaViewer → viewer、
            postProcessor → post、trend → trend。どれにも当たらなければ other。
    PluginDetail:
      allOf:
        - $ref: "#/components/schemas/PluginCard"
        - type: object
          properties:
            description: { type: string }
            screenshots: { type: array, items: { type: string, format: uri } }
            bannerUrl: { type: string, format: uri, description: ページ上部のバナー画像 }
            downloadsLastMonth: { type: integer, description: 先月のダウンロード数(集計が無ければ省略) }
            downloadHistory: { type: array, items: { type: integer }, description: 直近の累積 DL 推移(古い→新しい、等間隔。折れ線用) }
            ratingHistogram: { type: array, items: { type: integer }, minItems: 5, maxItems: 5, description: "評価の分布 [★1,★2,★3,★4,★5]" }
            channel: { type: string, enum: [stable, beta] }
            purchased: { type: boolean, description: 見ている RASQ アカウントが買っているか(有料のときだけ、ログイン中だけ。D-355。購入の記録は ORGATE にあり、Central が聞いて付ける、D-401) }
            updatedAt: { type: string, format: date-time }
            safety: { $ref: "#/components/schemas/SafetyBlock" }
            compatibility: { $ref: "#/components/schemas/Compatibility" }
            developer:
              type: object
              properties:
                name: { type: string }
                supportUrl: { type: string, format: uri }
    SafetyBlock:
      type: object
      description: 詳細画面上部の常設ブロック(権限・安全性)
      properties:
        rasqFeatures: { type: array, items: { type: string }, description: 利用できる RASQ 機能 }
        permissions: { type: array, items: { $ref: "#/components/schemas/PermissionEntry" } }
        externalHosts: { type: array, items: { type: string }, description: 外部通信先 }
        dataHandling: { type: string, description: 保存・送信されるデータの説明 }
        crashFreeRate: { type: number, description: 直近の正常起動率 (0-1) }
        backgroundExecution: { type: boolean }
        usesGpu: { type: boolean }
        externalSdks: { type: array, items: { type: string } }
        adPlacements: { type: array, items: { type: string } }
    PermissionEntry:
      type: object
      required: [permission]
      properties:
        permission: { type: string, description: manifest の権限 id (net.fetch / gpu_ml / storage.unsafe / …) }
        reason: { type: string, description: 用途ごとの権限理由(公開申請時に開発者が記入) }
    Compatibility:
      type: object
      properties:
        rasqVersion: { type: string, description: 対応 RASQ 本体バージョン範囲 (semver range) }
        os: { type: array, items: { type: string, enum: [ios, android, macos, windows, linux] } }
        requiresPlugins: { type: array, items: { type: string }, description: 必要な他プラグイン id }
        conflictsWith: { type: array, items: { type: string } }
        requiredRuntimes: { type: array, items: { type: string }, description: onnx / llama など }
    InstallManifest:
      type: object
      description: インストール確認シートと検証の根拠。plugin manifest 本体 + アーティファクト。
      required: [pluginId, version, manifest, artifacts]
      properties:
        pluginId: { type: string }
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        manifest: { type: object, description: schema/manifest.schema.json 準拠のプラグインマニフェスト }
        permissionsAdded: { type: array, items: { $ref: "#/components/schemas/PermissionEntry" }, description: 前版から増えた権限(自動更新停止のトリガー) }
        artifacts:
          type: array
          items:
            type: object
            required: [id, kind, sizeBytes, sha512, signature]
            properties:
              id: { type: string }
              kind: { type: string, enum: [bundle, model, asset], description: bundle = .rasqpkg 本体、model = ML モデル実体(遅延DL可) }
              sizeBytes: { type: integer }
              sha512: { type: string }
              signature: { type: string, description: ed25519(ストア鍵)。base64 }
              lazy: { type: boolean, description: true = 初回利用時にダウンロード(大型モデル) }
    Review:
      type: object
      required: [id, rating, createdAt]
      properties:
        id: { type: string }
        rating: { type: integer }
        title: { type: string, description: 見出し(無ければ本文 1 行目を表示) }
        body: { type: string }
        author:
          type: object
          description: 投稿者(RASQ アカウントの公開プロフィール。匿名なら省略)
          properties:
            name: { type: string }
            handle: { type: string, description: RASQ アカウントのハンドル(@なし。将来のアカウントページ導線) }
            avatarUrl: { type: string, format: uri }
        usedVersion: { type: string }
        verifiedUse: { type: boolean, description: 実利用済み(サーバーがインストール履歴から判定) }
        helpfulCount: { type: integer }
        notHelpfulCount: { type: integer }
        developerReply: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ReleaseNote:
      type: object
      required: [version, publishedAt]
      properties:
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        notes: { type: string }
        permissionsAdded: { type: array, items: { $ref: "#/components/schemas/PermissionEntry" } }
        publishedAt: { type: string, format: date-time }
    CustomSession:
      type: object
      description: ページ型プラグイン(shared)のセッション(rasq-central S-048、docs/slots.md §2.13)
      required: [id, pluginId, version, scope, title, ownerAccountId, ownerHandle, createdAt, participantCount]
      properties:
        id: { type: string }
        pluginId: { type: string }
        version: { type: string, description: セッションを作ったときの版(参加者はこの版を使う) }
        scope: { type: string, description: "room:<roomId> / profile:<accountId> / link:<sessionId>" }
        title: { type: string, description: manifest の page.title(無ければ name) }
        ownerAccountId: { type: string, format: uuid }
        ownerHandle: { type: string }
        inviteCode: { type: string, description: "link: のときだけ(招待リンク /custom/invites/{code})" }
        createdAt: { type: string, format: date-time }
        participantCount: { type: integer, description: 今 WS に入っている人数 }
    CustomParticipant:
      type: object
      required: [accountId, handle, displayName]
      properties:
        accountId: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
    CustomVar:
      type: object
      required: [value, rev, by]
      properties:
        value: { description: JSON の値(16 KiB まで) }
        rev: { type: integer, description: そのキーの版(書くたびに増える) }
        by: { type: string, format: uuid, description: 最後に書いた人の accountId }
    CustomVars:
      type: object
      description: キー → CustomVar。キーは ^[A-Za-z0-9_.:@-]{1,64}$(@<accountId>. で始まるキーはその本人だけが書ける)
      additionalProperties: { $ref: "#/components/schemas/CustomVar" }
    CustomWsClientMessage:
      description: カスタムセッションの WS でクライアントが送るもの
      oneOf:
        - type: object
          required: [type, key, value]
          properties:
            type: { const: set }
            key: { type: string }
            value: { description: "null で消す" }
            ifRev: { type: integer, description: 今の rev と違えば書かずに conflict }
        - type: object
          required: [type, key, op, value]
          properties:
            type: { const: op }
            key: { type: string }
            op: { type: string, enum: [incr, append, remove, merge] }
            value: {}
        - type: object
          required: [type, fn]
          properties:
            type: { const: call }
            fn: { type: string }
            args: { type: object }
        - type: object
          required: [type]
          properties:
            type: { const: ping }
    CustomWsServerMessage:
      description: カスタムセッションの WS でサーバーが送るもの(ホストが page.event に写す)
      oneOf:
        - type: object
          required: [type, me, session, participants, vars]
          properties:
            type: { const: welcome }
            me: { $ref: "#/components/schemas/CustomParticipant" }
            session: { $ref: "#/components/schemas/CustomSession" }
            participants: { type: array, items: { $ref: "#/components/schemas/CustomParticipant" } }
            vars: { $ref: "#/components/schemas/CustomVars" }
        - type: object
          required: [type, key, value, rev, by]
          properties:
            type: { const: var }
            key: { type: string, description: 書き換え後のキー(me. → @<accountId>.) }
            value: { description: null = 消えた }
            rev: { type: integer }
            by: { type: string, format: uuid }
        - type: object
          required: [type, fn, args, from]
          properties:
            type: { const: call }
            fn: { type: string }
            args: { type: object }
            from: { $ref: "#/components/schemas/CustomParticipant" }
        - type: object
          required: [type, participant]
          properties:
            type: { const: joined }
            participant: { $ref: "#/components/schemas/CustomParticipant" }
        - type: object
          required: [type, accountId]
          properties:
            type: { const: left }
            accountId: { type: string, format: uuid }
        - type: object
          required: [type, key, value, rev]
          properties:
            type: { const: conflict }
            key: { type: string }
            value: {}
            rev: { type: integer }
        - type: object
          required: [type, message]
          properties:
            type: { const: error }
            message: { type: string }
        - type: object
          required: [type, reason]
          properties:
            type: { const: closed }
            reason: { type: string }
        - type: object
          required: [type]
          properties:
            type: { const: pong }
    Points:
      type: object
      description: ポイントの残高と付与(ORGATE `GET /me/points`)。1 ポイント = 1 円、付与から 1 か月で失効
      required: [balance, grants]
      properties:
        balance: { type: integer, description: 失効していない付与の残りの合計 }
        grants:
          type: array
          items:
            type: object
            required: [amount, remaining, source, createdAt, expiresAt, expired]
            properties:
              amount: { type: integer }
              remaining: { type: integer }
              source: { type: string, description: "付与の出どころ(stripe / dummy / admin など)" }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
              expired: { type: boolean }
        purchases:
          type: array
          items:
            type: object
            required: [pluginId, pointsSpent, createdAt]
            properties:
              pluginId: { type: string }
              pluginName: { type: string }
              pointsSpent: { type: integer }
              createdAt: { type: string, format: date-time }
    PaymentsConfig:
      type: object
      description: 支払いの設定(ORGATE `GET /payments/config`)
      required: [paidFeatures, stripeMode, points, reviewFee]
      properties:
        paidFeatures: { type: boolean, description: "ポイント・ポイントの購入・有料プラグインが使えるか(ORGATE_PAID_FEATURES。公開テストは false)" }
        stripeMode: { type: string, enum: ["off", dummy, live] }
        points:
          type: object
          required: [available, packs, expiresAfterMonths]
          properties:
            available: { type: boolean, description: ポイントを買える(paidFeatures かつ stripeMode が off でない) }
            packs:
              type: array
              items:
                type: object
                required: [id, points, amountJpy]
                properties:
                  id: { type: string, description: "例 p500" }
                  points: { type: integer }
                  amountJpy: { type: integer }
            expiresAfterMonths: { type: integer, description: 付与から失効までの月数(1) }
        reviewFee:
          type: object
          description: プラグイン開発者の審査料(公開テストでも Stripe を使うのはこれだけ)。stripeMode が off でなく金額が 0 より大きいとき enabled
          required: [enabled, amountJpy, taxIncluded, currency, provisional]
          properties:
            enabled: { type: boolean }
            amountJpy: { type: integer, description: "既定 3000(ORGATE_REVIEW_FEE_JPY)" }
            taxIncluded: { type: boolean }
            currency: { type: string, const: jpy }
            provisional: { type: boolean, description: 金額が仮(未確定)か }
    ProfilePage:
      type: object
      description: プロフィールに置かれたページ型プラグイン 1 つ(並び順どおり)
      required: [pluginId, name, icon, mode]
      properties:
        pluginId: { type: string }
        version: { type: string, description: 固定した版(省略 = 現在版) }
        name: { type: string, description: manifest の page.title(無ければ name) }
        icon: { type: string, description: manifest の page.icon(Material Icon の名前。無ければ既定) }
        mode: { type: string, enum: [solo, shared] }
        sessionId: { type: string, description: "shared のとき、持ち主の有効な profile: セッションの id(まだ無ければ省略)" }
