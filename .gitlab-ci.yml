# RASQ SDK sample CI
# - rust: builds the wasm plugin sample + runs the wasmi runtime tests
# - dart: runs the Flutter FFI plugin's tests (the build hook shells out to
#   cargo, so Rust is installed in that job too).
# Flutter: ghcr.io/cirruslabs/flutter has no 3.47.x tag, so the dart job starts from
# the 3.44.0 image and switches the SDK checkout to FLUTTER_PIN (Dart 3.13 is needed).
stages:
- test

schema:
  stage: test
  image: python:3.12
  script:
    - pip install -q jsonschema referencing
    - python schema/validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

rust:
  stage: test
  image: rust:1
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - rust/target/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  script:
    - rustup target add wasm32-unknown-unknown
    - cd rust
    - cargo build --release --target wasm32-unknown-unknown -p misskey-wasm-sample
    - cargo build --release --target wasm32-unknown-unknown -p mastodon-wasm
    - cargo build --release --target wasm32-unknown-unknown -p bluesky-wasm
    - cargo test
    - cargo test --release -p rasq_wasm_runtime_core
    # rasq CLI (docs/cli.md): 全雛形を new → check(wasm32 ビルド → plugin.manifest 往復 → スキーマ → cargo test)→ token / dev
    - cargo build -p rasq-cli
    - export RASQ=$PWD/target/debug/rasq
    - rm -rf /tmp/rasq-e2e && mkdir -p /tmp/rasq-e2e && cd /tmp/rasq-e2e
    - $RASQ init --sns ci.test.sns --namespace ci.test
    - for s in post.transform tl trend.suggest viewer.overlay composer.media composer.text astell.action post.share post.action; do $RASQ new $s $(echo $s | tr . -); done
    - $RASQ check
    # wasm そのものを wasmi で叩く(native の cargo test では見つからない wasm だけの panic を拾う)
    - $RASQ call post-transform post.transform --args '{"posts":[{"id":"a","body":"こんにちは 世界"}]}' | tee /tmp/call.out && grep -q "こんにちは👋" /tmp/call.out
    - $RASQ call post-share post.share --args '{"token":"s","post":{"body":"本文"},"account":{},"link":"https://example.com/p/1"}' --reply 'fow.open={"opened":true}' --then share.copy --then post.share.close | tee /tmp/call2.out && grep -q "host clipboard.set" /tmp/call2.out && grep -q "host fow.close" /tmp/call2.out
    - $RASQ build --raw --no-build
    - RASQ_TOKEN=ci-dummy-token $RASQ token set other:example.test:ci --from-env RASQ_TOKEN
    - $RASQ token list
    - $RASQ dev
    - test -f .rasq/dev.json
    - $RASQ token remove other:example.test:ci
    - $RASQ key init && $RASQ key show
    - $RASQ build --raw --no-build
    - $RASQ inspect dist/ci.test.sns-0.1.0.rasqpkg
    # 他人の土台として読み込み、子ごとの .rasqpkg(requires 付き)を出す
    - rm -rf /tmp/rasq-e2e-third && mkdir -p /tmp/rasq-e2e-third && cd /tmp/rasq-e2e-third
    - $RASQ init --base /tmp/rasq-e2e/dist/ci.test.sns-0.1.0.rasqpkg --namespace ci.third
    - $RASQ new post.share tpl
    - $RASQ build
    - $RASQ inspect dist/ci.third.tpl-0.1.0.rasqpkg
    - $RASQ publish --central http://central.invalid:8080 --dry-run --no-build
    - test -f dist/publish/ci.third.tpl-0.1.0/04-upload-bundle.bin && test -f dist/publish/ci.third.tpl-0.1.0/03-publish-version.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

dart:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  cache:
    key: dart-$CI_COMMIT_REF_SLUG
    paths:
      - .pub-cache/
      - .cargo/
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    FLUTTER_PIN: "3.47.2"
  before_script:
    # cirruslabs のイメージは 3.44.0 までしか無い(3.47.x は manifest unknown)。
    # 3.44.0 のイメージに入っている Flutter の checkout を 3.47.2 のタグへ切り替える(Dart 3.13 が要る)。
    - git config --global --add safe.directory "$FLUTTER_HOME"
    - git -C "$FLUTTER_HOME" fetch --depth 1 origin "refs/tags/$FLUTTER_PIN:refs/tags/$FLUTTER_PIN"
    - git -C "$FLUTTER_HOME" checkout -q "$FLUTTER_PIN"
    - flutter --version
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup target add wasm32-unknown-unknown
    - (cd rust && cargo build --release --target wasm32-unknown-unknown -p misskey-wasm-sample -p mastodon-wasm)
  script:
    - cd rasq_wasm_runtime
    - dart pub get
    - dart analyze lib test hook
    - dart test
    - cd example
    - flutter pub get
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
